<!DOCTYPE html>
<html lang="pt-br"> <!-- definição de liguagem que o site vai ter -->
<head>
    <meta charset="UTF-8"> <!-- Tag <meta> para usar as acentuação que o português tem -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(0, 183, 255);
            color: white;
            font: normal 20pt arial;
        }

        h1 {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!</p>
    <script>
        window.alert('Minha primeira mensagem!') /* cod que aparece um pop-up com a mensagem inserida no código */
        window.confirm('Está gostando de JS ?') /* pop-up com mensagem e com opção de "ok" e "cancelar" */
        window.prompt('Qual é o seu nome ?') /* pop-up com mensagem, opção de "ok" e "cancelar" e uma caixa de texto*/
    </script>
</body>
</html>
