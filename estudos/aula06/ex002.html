<!DOCTYPE html>
<html lang="pt-br"> <!-- definição de liguagem que o site vai ter -->
<head>
    <meta charset="UTF-8"> <!-- Tag <meta> para usar as acentuação que o português tem -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(0, 183, 255);
            color: white;
            font: normal 20pt arial;
        }

        h1 {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!</p>
    <script>
        var nome = window.prompt('Qual é o seu nome ?')
        window.alert('É um grande prazer em te conhecer, ' + nome + '!') /* o + significa concatenação, junta as palavras */
    </script>
</body>
</html>
