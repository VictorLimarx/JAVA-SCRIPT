<!DOCTYPE html>
<html lang="pt-br"> <!-- definição de liguagem que o site vai ter -->
<head>
    <meta charset="UTF-8"> <!-- Tag <meta> para usar as acentuação que o português tem -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(0, 183, 255);
            color: white;
            font: normal 20pt arial;
        }

        h1 {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!</p>
    <script>
        var n1 = Number(window.prompt('Digite um número: '))
        var n2 = Number(window.prompt('Digite outro número: '))
        var s = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) /* Usando o template strings */  
        /* (number + number) sinal de + para adição */
        /* (string + string) para concatenação */
    </script>
</body>
</html>
