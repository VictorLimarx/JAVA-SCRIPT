<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
    <Style>
        Body {
            background-color: lightgray;
            font: normal 10pt Arial;
            text-align: center;
            color:darkblue;
        }

        input {
            border-color: blue;            
        }

        div {
            background-color: darkgrey;
            height: 30px;
            width: 270px;
            margin: 7px auto;

            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        div > p {
            margin: 0px;

        }
    </Style>
</head>
<body>
    <h1>Identificação de nacionalidade</h1>
    País: <input type="text" name="txtp" id="txtp">
    <input type="button" value="Verificar" onclick="analisar()">
    <div id="res">

    </div>
    <script>
        function analisar() {
            var pais = window.document.querySelector('input#txtp')
            var p = (pais.value)

            if (p == 'Brasil') {
                res.innerHTML = `<p>Você é um (a) <strong>brasileiro!</strong></p>`
            } else {
                res.innerHTML = `<p>Você é um (a) <strong>estrangeiro!</strong></p>`
            }
        }
    </script>
</body>
</html>
